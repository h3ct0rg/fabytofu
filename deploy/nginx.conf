# Protocolo público: si hay un proxy inverso con HTTPS delante, usa el que él informa.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de código y datos (las imágenes PNG ya vienen comprimidas).
    # Los .js ya salen como application/javascript con el mime.types por defecto de nginx,
    # que es lo que necesitan los módulos ES del juego.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # JS, CSS y JSON (y el HTML, más abajo): el navegador siempre revalida, así cada actualización del juego
    # se ve al recargar, sin quedar con archivos viejos en caché.
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes: caché de 7 días.
    location ~* \.(png|jpg|jpeg|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        # Las etiquetas de vista previa necesitan la dirección completa del sitio.
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '__SITE_URL__' '$public_proto://$http_host';
        try_files $uri $uri/ /index.html;
    }
}
